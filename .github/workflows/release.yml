name: Release

on:
  push:
    tags:
      - "*.*.*"

# Publishing uses PyPI trusted publishing (OIDC), so no API token is needed.
# Register this workflow as a publisher on PyPI
# (project -> Publishing -> Add a new publisher): owner `BenGale93`,
# repository `typ-tables`, workflow `release.yml`, environment `pypi`.
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/typ-tables/

    steps:
      - uses: actions/checkout@v6

      - name: Check the changelog is ready
        run: |
          if ! grep -q "^## ${GITHUB_REF_NAME} " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## ${GITHUB_REF_NAME}' section. Run 'just release ${GITHUB_REF_NAME}' before tagging."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          # Install a specific version of uv.
          version: "0.13.1"

      - name: Set up Python
        run: uv python install 3.11

      - name: Build the distribution
        run: uv build --clear

      - name: Publish to PyPI
        run: uv publish

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v heading="## ${GITHUB_REF_NAME} " '
            index($0, heading) == 1 { in_section = 1; next }
            in_section && /^## / { exit }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
